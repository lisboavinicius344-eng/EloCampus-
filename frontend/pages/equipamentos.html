<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1020">
  <title>Equipamentos — ELO Campus</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/equipamentos.css">
</head>
<body data-pagina="equipamentos">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="content">
      <header class="topbar" id="topbar"></header>

      <main class="main">
        <div class="page-head">
          <div>
            <h1>Equipamentos</h1>
            <p>Busque pelo nome ou patrimônio e filtre por situação, setor e condição.</p>
          </div>
          <a class="btn btn-primary" href="equipamento-form.html">+ Cadastrar equipamento</a>
        </div>

        <div class="alert alert-info" id="aviso-demo" style="margin-bottom:1.25rem" hidden>
          Você está vendo dados de demonstração.
        </div>
        <div class="alert alert-error" id="erro" style="margin-bottom:1.25rem" role="alert" hidden></div>

        <form class="filtros" id="filtros" role="search" aria-label="Filtrar equipamentos">
          <div class="field campo-busca">
            <label for="f-busca">Buscar</label>
            <input class="input" id="f-busca" type="search" placeholder="Nome ou número de patrimônio" autocomplete="off">
          </div>
          <div class="field">
            <label for="f-situacao">Situação</label>
            <select class="input" id="f-situacao"><option value="">Todas</option></select>
          </div>
          <div class="field">
            <label for="f-categoria">Tipo</label>
            <select class="input" id="f-categoria"><option value="">Todos</option></select>
          </div>
          <div class="field">
            <label for="f-setor">Setor</label>
            <select class="input" id="f-setor"><option value="">Todos</option></select>
          </div>
          <div class="field">
            <label for="f-condicao">Condição</label>
            <select class="input" id="f-condicao"><option value="">Todas</option></select>
          </div>
          <button class="btn btn-ghost" type="button" id="limpar">Limpar filtros</button>
        </form>

        <section class="panel" aria-label="Lista de equipamentos">
          <div class="lista-info"><span id="contagem" aria-live="polite">Carregando…</span></div>
          <div class="table-wrap" id="lista"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/dados-demo.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/equipamentos.js"></script>
</body>
</html>
