<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Categorias — ELO Campus</title>
    <link rel="icon" href="../assets/img/logo.png" />
    <link rel="stylesheet" href="../assets/css/style.css?v=2026.10.29.5" />
    <link rel="stylesheet" href="../assets/css/layout.css?v=2026.10.29.5" />
    <link rel="stylesheet" href="../assets/css/salz-bridge.css?v=2026.10.29.5" />
    <link rel="stylesheet" href="../assets/css/gestao-api.css?v=2026.10.29.5" />
  </head>
  <body data-pagina="categorias">
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="content">
        <header class="topbar" id="topbar"></header>
        <main class="main">
          <header class="page-head">
            <div>
              <h1>Categorias</h1>
              <p>Gerencie as categorias usadas na identificação dos equipamentos.</p>
            </div>
          </header>
          <div id="cat-aviso" class="alert" role="status" aria-live="polite" hidden></div>
          <section class="card stack">
            <h2 id="cat-form-title">Nova categoria</h2>
            <form id="cat-form" class="stack">
              <input type="hidden" id="cat-id" />
              <div class="api-grid">
                <div class="field">
                  <label for="cat-nome">Nome *</label
                  ><input class="input input-block" id="cat-nome" maxlength="80" required />
                </div>
                <div class="field">
                  <label for="cat-desc">Descrição</label
                  ><input class="input input-block" id="cat-desc" maxlength="240" />
                </div>
              </div>
              <div class="api-actions">
                <button class="btn btn-primary" type="submit" id="cat-save">Cadastrar categoria</button
                ><button class="btn btn-ghost" type="button" id="cat-cancel" hidden>Cancelar edição</button>
              </div>
            </form>
          </section>
          <section class="card stack">
            <div class="row">
              <h2>Categorias cadastradas</h2>
              <button class="btn btn-line" id="cat-refresh" type="button">Atualizar</button>
            </div>
            <div class="table-wrap">
              <table class="api-table">
                <thead>
                  <tr>
                    <th>Código</th>
                    <th>Categoria</th>
                    <th>Descrição</th>
                    <th>Situação</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="cat-tbody">
                  <tr>
                    <td colspan="5">Carregando…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="../assets/js/runtime-config.js?v=2026.10.29.4"></script>
    <script src="../assets/js/api.js?v=2026.10.29.4"></script>
    <script src="../assets/js/auth.js?v=2026.10.29.4"></script>
    <script src="../assets/js/layout.js?v=2026.10.29.4"></script>
    <script src="../assets/js/categorias-ui.js?v=2026.10.29.4"></script>
  </body>
</html>
