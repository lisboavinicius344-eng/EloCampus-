<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Categorias — ELO Campus</title>
    <link rel="icon" href="../assets/img/logo.png" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/salz-bridge.css" />
    <style>
      .api-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
        gap: 1rem;
      }
      .api-table {
        width: 100%;
        border-collapse: collapse;
      }
      .api-table th,
      .api-table td {
        padding: 0.75rem;
        text-align: left;
        border-bottom: 1px solid var(--border, #283247);
        vertical-align: top;
      }
      .api-code {
        display: inline-block;
        padding: 0.25rem 0.55rem;
        border-radius: 0.4rem;
        background: rgba(103, 201, 208, 0.12);
        color: var(--cyan, #67c9d0);
        font-weight: 700;
      }
      .api-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .api-note {
        color: var(--muted);
      }
      @media (max-width: 650px) {
        .api-table {
          min-width: 700px;
        }
      }
    </style>
    <link rel="stylesheet" href="../assets/css/page-polish.css">
</head>
  <body data-pagina="categorias">
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="content">
        <header class="topbar" id="topbar"></header>
        <main class="main">
          <header class="page-head">
            <div>
              <h1>Categorias</h1>
              <p>Gerencie as categorias usadas na identificação dos equipamentos.</p>
            </div>
          </header>
          <div id="cat-aviso" class="alert" role="status" aria-live="polite" hidden></div>
          <section class="card stack">
            <h2 id="cat-form-title">Nova categoria</h2>
            <form id="cat-form" class="stack">
              <input type="hidden" id="cat-id" />
              <div class="api-grid">
                <div class="field">
                  <label for="cat-nome">Nome *</label
                  ><input class="input input-block" id="cat-nome" maxlength="80" required />
                </div>
                <div class="field">
                  <label for="cat-desc">Descrição</label
                  ><input class="input input-block" id="cat-desc" maxlength="240" />
                </div>
              </div>
              <div class="api-actions">
                <button class="btn btn-primary" type="submit" id="cat-save">
                  Cadastrar categoria</button
                ><button class="btn btn-ghost" type="button" id="cat-cancel" hidden>
                  Cancelar edição
                </button>
              </div>
            </form>
          </section>
          <section class="card stack">
            <div class="row" style="align-items: center; justify-content: space-between">
              <h2>Categorias cadastradas</h2>
              <button class="btn btn-line" id="cat-refresh" type="button">Atualizar</button>
            </div>
            <div class="table-wrap">
              <table class="api-table">
                <thead>
                  <tr>
                    <th>Código</th>
                    <th>Categoria</th>
                    <th>Descrição</th>
                    <th>Situação</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="cat-tbody">
                  <tr>
                    <td colspan="5">Carregando…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="../assets/js/runtime-config.js?v=2026.10.29.1"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/categorias-ui.js"></script>
  </body>
</html>
