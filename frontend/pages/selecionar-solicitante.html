<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1020">
  <title>Escolher solicitante — ELO Campus</title>
  <link rel="icon" type="image/png" href="../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=2026.11.06.3">
  <link rel="stylesheet" href="../assets/css/layout.css?v=2026.11.06.3">
  <link rel="stylesheet" href="../assets/css/page-polish.css?v=2026.11.06.3">
  <link rel="stylesheet" href="../assets/css/selecionar-solicitante.css?v=2026.11.06.3">
</head>
<body data-pagina="emprestimos">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="content">
      <header class="topbar" id="topbar"></header>
      <main class="main">
        <header class="page-head">
          <div>
            <span class="eyebrow">NOVO EMPRÉSTIMO</span>
            <h1>Escolha o solicitante</h1>
            <p>Selecione primeiro quem receberá os equipamentos. Depois você poderá montar o empréstimo.</p>
          </div>
          <a class="btn btn-line" href="emprestimos.html">Voltar aos empréstimos</a>
        </header>
        <div id="solicitante-aviso" class="alert" role="status" aria-live="polite" hidden></div>
        <section class="card solicitante-selector">
          <div class="selector-head">
            <div>
              <h2>Usuários cadastrados</h2>
              <p class="muted">Somente cadastros ativos podem iniciar um novo empréstimo.</p>
            </div>
            <div class="selector-search">
              <label class="sr-only" for="busca-solicitante">Pesquisar usuário</label>
              <input class="input" id="busca-solicitante" type="search" placeholder="Nome, matrícula ou identificação">
            </div>
          </div>
          <div id="solicitantes-lista" class="solicitantes-selection-grid" aria-live="polite">
            <p class="muted">Carregando usuários…</p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../assets/js/runtime-config.js?v=2026.11.06.3"></script>
  <script src="../assets/js/api.js?v=2026.11.06.3"></script>
  <script src="../assets/js/auth.js?v=2026.11.06.3"></script>
  <script src="../assets/js/layout.js?v=2026.11.06.3"></script>
  <script src="../assets/js/selecionar-solicitante.js?v=2026.11.06.3"></script>
</body>
</html>
