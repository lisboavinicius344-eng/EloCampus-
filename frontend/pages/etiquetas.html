  <link rel="icon" type="image/png" href="../assets/img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-pagina="equipamentos" class="etiquetas-page">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="content">
      <header class="topbar" id="topbar"></header>

      <main class="main">
        <div class="page-head no-print">
          <div>
            <h1>Etiquetas com QR Code</h1>
            <p id="etiquetas-resumo" aria-live="polite">Carregando…</p>
          </div>
          <div class="toolbar">
            <a class="btn btn-ghost" href="equipamentos.html">Voltar para a lista</a>
            <button class="btn btn-primary" type="button" id="etiquetas-imprimir">Imprimir</button>
          </div>
        </div>

        <div class="alert alert-info no-print" id="etiquetas-destino" role="note" hidden></div>
        <div class="alert no-print" id="etiquetas-aviso" role="status" hidden></div>
        <p class="muted small no-print etiquetas-dica">Folha A4 de adesivo, 3 colunas. Na caixa de impressão, use escala 100% (“Tamanho real”) e desative cabeçalhos e rodapés. Imprima uma folha de teste e leia 2 ou 3 etiquetas com o celular antes de imprimir o restante.</p>

        <section class="folha-etiquetas" id="folha-etiquetas" aria-label="Etiquetas para impressão">
          <p class="estado-vazio no-print">Carregando etiquetas…</p>
        </section>
      </main>
    </div>
  </div>
