<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1020">
  <title>Consulta por QR Code — ELO Campus</title>
  <meta name="description" content="Leia o QR Code de um equipamento do ELO Campus.">
  <link rel="icon" type="image/png" href="../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/qr.css">
</head>
<body class="qr-page">
  <main class="qr-shell">
    <header class="qr-brand"><a href="../index.html" aria-label="Voltar para a página inicial"><img src="../assets/img/logo.png" alt=""><span>ELO Campus<small>Controle de equipamentos</small></span></a></header>
    <section class="qr-card" aria-labelledby="titulo-consulta">
      <div class="qr-heading"><div class="qr-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2M20 14v6h-6M17 17h.01"/></svg></div><div><h1 id="titulo-consulta">Consultar equipamento</h1><p>Leia o QR Code usando a câmera ou escolha uma imagem da galeria.</p></div></div>
      <div class="qr-reader" id="qr-reader">
        <video id="qr-video" playsinline muted aria-label="Pré-visualização da câmera"></video>
        <div class="qr-frame" aria-hidden="true"></div>
        <p class="qr-reader-hint" id="qr-reader-hint">Aponte a câmera para o QR Code do equipamento.</p>
      </div>
      <div class="qr-actions"><button class="btn btn-primary" type="button" id="abrir-camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3"/></svg>Abrir câmera</button><label class="btn btn-ghost qr-file-btn" for="qr-arquivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v14H4zM8 15l2.5-3 2 2 1.5-2 3 3"/></svg>Usar galeria<input id="qr-arquivo" type="file" accept="image/*"></label></div>
      <p class="qr-permission" id="qr-permission" role="status" aria-live="polite"></p>
      <div class="qr-divider"><span>ou informe o identificador</span></div>
      <form id="consulta-form" class="qr-form" novalidate><div class="field"><label for="codigo">Identificador do QR Code</label><input class="input" id="codigo" name="codigo" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Informe o identificador"></div><button class="btn btn-primary" id="consultar-btn" type="submit">Consultar</button></form>
      <div id="consulta-status" class="qr-status" role="status" aria-live="polite"></div><section id="resultado" class="qr-result" aria-live="polite" hidden></section>
    </section>
    <footer class="qr-footer"><a href="../index.html">Voltar para entrar</a></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/qr.js"></script>
</body>
</html>
