<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuração do perfil — ELO Campus</title><link rel="icon" href="../assets/img/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/perfil.css"></head><body data-pagina="perfil"><div class="app"><aside class="sidebar" id="sidebar"></aside><div class="content"><header class="topbar" id="topbar"></header><main class="main"><div class="page-head"><div><h1>Configuração do perfil</h1><p>Dados de acesso e identificação institucional.</p></div></div><div class="alert alert-error" id="erro" hidden></div><div class="alert alert-ok" id="sucesso" hidden></div><section class="panel profile-panel"><form id="perfil-form" novalidate><div class="profile-avatar" id="profile-avatar">?</div><label class="profile-photo-label" for="foto-perfil">Imagem do perfil <input id="foto-perfil" type="file" accept="image/*"></label><div class="form-grid"><div class="field"><label for="nome">Nome completo</label><input class="input" id="nome" required></div><div class="field"><label for="email">E-mail institucional</label><input class="input" id="email" type="email" placeholder="nome@instituicao.edu.br" required></div><div class="field"><label for="telefone">Telefone</label><input class="input" id="telefone" type="tel" placeholder="(00) 00000-0000" required></div><div class="field"><label for="instituicao">Instituição de ensino</label><input class="input" id="instituicao" placeholder="Ex.: Instituto Federal" required></div><div class="field"><label for="campus">Campus</label><input class="input" id="campus" placeholder="Ex.: Campus Lapa" required></div><div class="field"><label for="matricula">Matrícula / número funcional</label><input class="input" id="matricula" placeholder="Ex.: 2024001234 ou SRV-0024" required></div><div class="field"><label for="setor">Setor / curso</label><select class="input" id="setor" required><option value="">Selecione</option><option>Direção</option><option>Coordenação de TI</option><option>Secretaria</option><option>Audiovisual</option><option>Biblioteca</option><option>Docência</option><option>Discente</option></select></div><div class="field"><label for="perfil">Perfil de acesso</label><input class="input" id="perfil" readonly></div></div><label class="check-row"><input id="notificacoes" type="checkbox"><span>Receber notificações do sistema</span></label><div class="form-actions"><button class="btn btn-primary" id="salvar" type="submit">Salvar alterações</button><a class="btn btn-ghost" href="dashboard.html">Cancelar</a></div></form></section></main></div></div><script src="../assets/js/auth.js"></script><script src="../assets/js/layout.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/perfil.js"></script></body></html>
