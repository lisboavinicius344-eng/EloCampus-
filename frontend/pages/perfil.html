<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1020">
  <title>Meu perfil — ELO Campus</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=2026.10.28.10">
  <link rel="stylesheet" href="../assets/css/layout.css?v=2026.10.28.10">
  <link rel="stylesheet" href="../assets/css/perfil.css?v=2026.10.28.10">
</head>
<body data-pagina="perfil">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="content">
      <header class="topbar" id="topbar"></header>
      <main class="main">
        <div class="page-head">
          <div>
            <h1>Meu perfil</h1>
            <p>Consulte os dados vinculados à sua conta e gerencie sua senha.</p>
          </div>
        </div>
        <section class="panel profile-panel" aria-labelledby="perfil-nome-titulo">
          <div class="profile-overview">
            <div class="profile-avatar" id="profile-avatar" aria-hidden="true">?</div>
            <div class="profile-heading">
              <h2 id="perfil-nome-titulo">Carregando perfil…</h2>
              <p id="perfil-email-sub" class="muted"></p>
              <span class="profile-readonly-note">Dados somente para leitura</span>
            </div>
          </div>
          <dl class="profile-readonly-grid">
            <div class="profile-readonly-item"><dt>Nome completo</dt><dd id="perfil-nome">—</dd></div>
            <div class="profile-readonly-item"><dt>E-mail institucional</dt><dd id="perfil-email">—</dd></div>
            <div class="profile-readonly-item"><dt>Perfil de acesso</dt><dd id="perfil-papel">—</dd></div>
            <div class="profile-readonly-item"><dt>ID da conta</dt><dd id="perfil-id">—</dd></div>
            <div class="profile-readonly-item" id="perfil-solicitante-row" hidden><dt>Cadastro de solicitante</dt><dd id="perfil-solicitante">—</dd></div>
          </dl>
          <div class="form-actions profile-actions">
            <a class="btn btn-primary" href="trocar-senha.html">Alterar minha senha</a>
            <a class="btn btn-ghost" href="dashboard.html">Voltar ao painel</a>
            <button class="btn btn-danger" id="perfil-sair" type="button">Sair da conta</button>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../assets/js/auth.js?v=2026.10.28.10"></script>
  <script src="../assets/js/layout.js?v=2026.10.28.10"></script>
  <script src="../assets/js/perfil.js?v=2026.10.28.10"></script>
</body>
</html>
