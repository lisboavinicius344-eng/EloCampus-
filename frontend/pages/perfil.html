<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configuração do perfil — ELO Campus</title>

    <link rel="icon" href="../assets/img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../assets/css/style.css?v=2026.10.29.8">
    <link rel="stylesheet" href="../assets/css/layout.css?v=2026.10.29.8">
    <link rel="stylesheet" href="../assets/css/perfil.css?v=2026.10.29.8">
<link rel="stylesheet" href="../assets/css/page-polish.css?v=2026.10.29.8"></head>
<body data-pagina="perfil">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="content">
            <header class="topbar" id="topbar"></header>

            <main class="main">
                <div class="page-head">
                    <div>
                        <h1 id="titulo-dados-conta">Meu perfil</h1>
                        <p>Dados de acesso e identificação institucional.</p>
                    </div>
                </div>

                <section class="panel profile-panel" aria-labelledby="titulo-dados-conta">
                    <p class="muted">Atualize seus dados pessoais. O e-mail institucional e a matrícula são somente para consulta.</p>
                    <div class="profile-avatar" id="profile-avatar" aria-hidden="true">?</div>
                    <div class="form-grid">
                        <div class="field">
                            <label for="nome">Nome completo</label>
                            <input class="input" id="nome" maxlength="160" autocomplete="name">
                        </div>
                        <div class="field">
                            <label for="email">E-mail institucional</label>
                            <input class="input" id="email" type="email" readonly aria-readonly="true">
                        </div>
                        <div class="field">
                            <label for="perfil">Perfil de acesso</label>
                            <input class="input" id="perfil" readonly aria-readonly="true">
                        </div>
                        <div class="field" id="campo-telefone" hidden>
                            <label for="telefone">Telefone</label>
                            <input class="input" id="telefone" type="tel" maxlength="30" placeholder="(77) 99999-0000" autocomplete="tel">
                        </div>
                        <div class="field" id="campo-matricula" hidden>
                            <label for="matricula">Matrícula</label>
                            <input class="input" id="matricula" readonly aria-readonly="true">
                        </div>
                    </div>
                    <div class="alert" id="perfil-mensagem" role="status" hidden></div>
                    <button class="btn btn-primary" id="perfil-salvar" type="button">Salvar alterações</button>
                    <div class="form-actions">
                        <a class="btn btn-line" href="trocar-senha.html">Alterar minha senha</a>
                        <a class="btn btn-ghost" href="dashboard.html">Voltar ao painel</a>
                        <button class="btn btn-danger" id="perfil-sair" type="button">Sair da conta</button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="../assets/js/auth.js?v=2026.10.29.8"></script>
    <script src="../assets/js/layout.js?v=2026.10.29.8"></script>
    <script src="../assets/js/runtime-config.js?v=2026.10.29.8"></script>
  <script src="../assets/js/api.js?v=2026.10.29.8"></script>
    <script src="../assets/js/perfil.js?v=2026.10.29.8"></script>
</body>
</html>
