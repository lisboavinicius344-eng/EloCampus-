<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0B1020">
  <title>Configuração do perfil — ELO Campus</title><link rel="icon" type="image/png" href="../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/perfil.css">
</head>
<body data-pagina="perfil"><div class="app"><aside class="sidebar" id="sidebar"></aside><div class="content"><header class="topbar" id="topbar"></header><main class="main">
  <div class="page-head"><div><h1>Configuração do perfil</h1><p>Atualize seus dados de identificação e preferências.</p></div></div>
  <div class="alert alert-error" id="erro" role="alert" hidden></div><div class="alert alert-ok" id="sucesso" role="status" hidden></div>
  <section class="panel profile-panel"><form id="perfil-form" novalidate>
    <div class="profile-avatar" id="profile-avatar" aria-hidden="true">?</div>
    <div class="form-grid"><div class="field"><label for="nome">Nome de exibição</label><input class="input" id="nome" name="nome" type="text" autocomplete="name" required></div><div class="field"><label for="email">E-mail</label><input class="input" id="email" name="email" type="email" autocomplete="email"></div><div class="field"><label for="telefone">Telefone</label><input class="input" id="telefone" name="telefone" type="tel" autocomplete="tel"></div><div class="field"><label for="perfil">Perfil de acesso</label><input class="input" id="perfil" name="perfil" type="text" readonly></div></div>
    <label class="check-row"><input id="notificacoes" type="checkbox"><span>Receber notificações do sistema</span></label>
    <div class="form-actions"><button class="btn btn-primary" id="salvar" type="submit">Salvar alterações</button><a class="btn btn-ghost" href="dashboard.html">Cancelar</a></div>
  </form></section>
</main></div></div>
<script src="../assets/js/auth.js"></script><script src="../assets/js/layout.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/perfil.js"></script>
</body></html>
