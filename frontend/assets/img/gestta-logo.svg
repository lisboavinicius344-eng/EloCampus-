<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Gestta — equipamentos sempre na mão</title>
  <desc id="desc">Logo com duas correntes entrelaçadas em tons de verde, o nome Gestta e o lema equipamentos sempre na mão.</desc>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d34"/>
      <stop offset="1" stop-color="#004c3b"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19a66e"/>
      <stop offset="1" stop-color="#08784f"/>
    </linearGradient>
  </defs>

  <!-- Símbolo: dois elos arredondados entrelaçados -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="22">
    <rect x="379" y="150" width="152" height="82" rx="40" transform="rotate(-45 455 191)" stroke="url(#forest)"/>
    <rect x="469" y="174" width="152" height="82" rx="40" transform="rotate(-45 545 215)" stroke="url(#emerald)"/>
  </g>
  <!-- Nome da marca -->
  <text x="500" y="465" text-anchor="middle"
        font-family="Inter, Montserrat, 'Segoe UI', Arial, sans-serif"
        font-size="126" font-weight="800" letter-spacing="-3.5"
        fill="url(#forest)">Gestta</text>

  <!-- Assinatura -->
  <text x="500" y="525" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="32" font-weight="400" letter-spacing="1.15"
        fill="#145b46">equipamentos sempre na mão</text>
</svg>
